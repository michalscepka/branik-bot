name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/BranikBot.slnx
      
    - name: Build
      run: dotnet build src/BranikBot.slnx --no-restore
      
    - name: Test
      run: dotnet test src/BranikBot.slnx --no-build --verbosity normal
