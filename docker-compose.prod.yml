services:
  branik-bot:
    image: mscepka/branik-bot:latest
    container_name: branik-bot
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Discord__BotToken=${DISCORD_BOT_TOKEN}
    volumes:
      - branik-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  branik-data:
