name: branik-bot-dev

services:
  branik-bot:
    build:
      context: ./src
      dockerfile: BranikBot/Dockerfile
    container_name: branik-bot-local
    environment:
      - DOTNET_ENVIRONMENT=Development
      - Discord__BotToken=<BOT_TOKEN>
    volumes:
      - branik-data:/app/data

volumes:
  branik-data:
